[project]
name = "kommun-agent"
version = "0.1.0"
description = "An AI agent that answers residents' questions about municipal services, grounded in the municipality's own web pages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "rank-bm25>=0.2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kommun-agent = "kommun_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kommun_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
