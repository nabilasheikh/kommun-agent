<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kommun Assistant</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5f6b7a; --accent:#1f5fae; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1d2126; --ink:#e8eaed; --muted:#9aa4b1; --accent:#7fb0ff; --line:#2c3238; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; height:100vh; }
  header h1 { font-size:1.25rem; margin:0; } header p { margin:4px 0 16px; color:var(--muted); font-size:.9rem; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:12px; }
  .msg { padding:12px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  .bot a { color:var(--accent); }
  .meta { font-size:.75rem; color:var(--muted); margin-top:6px; white-space:normal; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Kommun Assistant</h1>
    <p>Answers come only from the municipality's own web pages, with sources. Don't share your personnummer.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="T.ex. Hur ansöker jag om förskoleplats?" required>
    <button id="b">Send</button>
  </form>
</main>
<script>
const log = document.getElementById('log'), form = document.getElementById('f'),
      input = document.getElementById('q'), btn = document.getElementById('b');
const history = [];
fetch('/api/info').then(r => r.json()).then(i => { document.getElementById('title').textContent = i.kommun + ' – digital assistant'; }).catch(() => {});

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(md) {
  return esc(md)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function add(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }

form.addEventListener('submit', async e => {
  e.preventDefault();
  const message = input.value.trim(); if (!message) return;
  add('user', esc(message)); input.value = ''; btn.disabled = true;
  const pending = add('bot', '…');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message, history }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const tools = data.tool_calls.map(t => t.name).join(', ') || 'none';
    const ticket = data.tickets.length ? ' · ticket ' + data.tickets.join(', ') : '';
    pending.innerHTML = render(data.answer) + `<div class="meta">tools: ${esc(tools)}${esc(ticket)} · ${data.latency_s}s · ${data.tokens} tokens</div>`;
    history.push({ role:'user', content: message }, { role:'assistant', content: data.answer });
  } catch (err) {
    pending.textContent = 'Something went wrong: ' + err.message;
  } finally { btn.disabled = false; input.focus(); }
});
</script>
</body>
</html>
